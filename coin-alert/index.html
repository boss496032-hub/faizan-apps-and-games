<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faizan Coin Alert</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white}
.header{padding:20px;background:linear-gradient(135deg,#f59e0b,#ef4444);text-align:center}
.card{background:#1e293b;margin:12px;padding:15px;border-radius:12px;display:flex;align-items:center;gap:12px}
.card img{width:40px;height:40px;border-radius:50%}
.price{margin-left:auto;text-align:right}
.btn{background:#22c55e;border:none;color:white;padding:12px;border-radius:8px;font-weight:bold;display:block;text-align:center;text-decoration:none;margin:10px}
</style>
</head>
<body>
<div class="header">
<h2>🚨 Faizan Coin Alert</h2>
<p>Live New Coins Tracker</p>
<a class="btn" href="#" id="installBtn" style="display:none;background:#3b82f6">📲 DOWNLOAD / INSTALL APP</a>
<a class="btn" href="#" onclick="downloadCSV()">⬇️ DOWNLOAD COIN LIST (Excel)</a>
</div>
<div id="coins">Loading...</div>
<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block';});
document.getElementById('installBtn').addEventListener('click', async()=>{if(deferredPrompt){deferredPrompt.prompt();}});
let coinData=[];
async function loadCoins(){
 const res=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=20&page=1');
 coinData=await res.json();
 let html='';
 coinData.forEach(c=>{
  html+=`<div class="card"><img src="${c.image}"><div><b>${c.name}</b> (${c.symbol.toUpperCase()})<br><small>$${c.current_price}</small></div><div class="price">${c.price_change_percentage_24h.toFixed(2)}%</div></div>`;
 });
 document.getElementById('coins').innerHTML=html;
}
function downloadCSV(){
 let csv="Name,Symbol,Price,24h%\n";
 coinData.forEach(c=>{csv+=`${c.name},${c.symbol},${c.current_price},${c.price_change_percentage_24h}\n`;});
 let blob=new Blob([csv],{type:'text/csv'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='faizan-coins.csv';a.click();
}
loadCoins();
</script>
</body>
</html>
