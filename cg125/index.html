<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CG 125 PRO - Faizan Store</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4158618600102650" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070a14;color:#fff;font-family:Arial;overflow:hidden}
header{background:#0f1324;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff3b3b}
.logo{color:#ff3b3b;font-weight:900}
a{color:#8aff6b;text-decoration:none;font-size:13px}
.game-wrap{position:relative;width:100%;height:calc(100vh - 50px);max-width:800px;margin:0 auto;background:linear-gradient(#1a2332 0%, #0f1419 100%)}
canvas{width:100%;height:100%;display:block}
.ui{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10}
.score-box{background:rgba(0,0,0,0.8);padding:8px 12px;border-radius:8px;border:1px solid #ff3b3b;font-size:13px}
.controls{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:space-around;z-index:10}
.btn{background:rgba(255,59,59,0.9);border:none;color:#fff;padding:15px 25px;border-radius:10px;font-weight:800;font-size:16px}
.btn:active{transform:scale(0.95)}
#startScreen{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(7,10,20,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
.bike-logo{width:280px;max-width:90%;image-rendering:pixelated;filter:drop-shadow(0 0 20px #ff3b3b)}
</style>
</head>
<body>
<header><div class="logo">🏍️ CG 125 PRO</div><div><a href="../">Home</a> | <a href="../dashboard.html">Dashboard</a></div></header>
<div class="game-wrap">
<div class="ui"><div class="score-box">🏆 Score: <span id="score">0</span></div><div class="score-box">⛽ Speed: <span id="speed">0</span> KM/H</div></div>
<canvas id="game"></canvas>
<div class="controls"><button class="btn" id="leftBtn">◀ LEFT</button><button class="btn" id="rightBtn">RIGHT ▶</button></div>
<div id="startScreen">
<img src="bike.png" class="bike-logo" onerror="this.src='https://i.ibb.co/0jZq0X0/cg125.png'">
<h1 style="color:#ff3b3b;margin:15px 0;">HONDA CG 125 PRO</h1>
<p style="color:#94a3b8;font-size:13px;margin-bottom:15px;">Pakistan's Most Powerful Bike Game<br>Use LEFT/RIGHT to dodge traffic!</p>
<button onclick="startGame()" style="background:#ff3b3b;color:#fff;border:none;padding:14px 35px;border-radius:10px;font-weight:900;font-size:18px;">▶ PLAY NOW</button>
<p style="color:#64748b;font-size:11px;margin-top:15px;">Made by Faizan Store | Lahore 🇵🇰</p>
</div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,score=0,speed=0,gameRunning=false,bike={x:0,y:0,w:80,h:40},keys={},obstacles=[],roadOffset=0;
function resize(){W=canvas.width=canvas.offsetWidth*2;H=canvas.height=canvas.offsetHeight*2;bike.x=W/2-40;bike.y=H-200;}
window.addEventListener('resize',resize);resize();
const bikeImg=new Image();bikeImg.src='bike.png';
let left=false,right=false;
document.getElementById('leftBtn').addEventListener('touchstart',()=>left=true);document.getElementById('leftBtn').addEventListener('touchend',()=>left=false);
document.getElementById('rightBtn').addEventListener('touchstart',()=>right=true);document.getElementById('rightBtn').addEventListener('touchend',()=>right=false);
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')left=true;if(e.key==='ArrowRight')right=true;});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false;});
function startGame(){document.getElementById('startScreen').style.display='none';gameRunning=true;score=0;speed=0;obstacles=[];bike.x=W/2-40;loop();}
function spawnObstacle(){obstacles.push({x:Math.random()*(W-120)+20,y:-100,w:60,h:100,color:Math.random()>0.5?'#fbbf24':'#38bdf8',speed:8+Math.random()*6});}
function loop(){
if(!gameRunning)return;
roadOffset+=15+speed/10;
ctx.clearRect(0,0,W,H);
// Road
ctx.fillStyle='#1e293b';ctx.fillRect(W*0.15,0,W*0.7,H);
ctx.fillStyle='#334155';for(let i=0;i<20;i++){let y=(i*120+roadOffset)%(H+120)-120;ctx.fillRect(W/2-4,y,8,60);}
ctx.fillStyle='#ff3b3b';ctx.fillRect(W*0.15,0,8,H);ctx.fillRect(W*0.85,0,8,H);
// Obstacles
if(Math.random()<0.04)spawnObstacle();
for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];o.y+=o.speed+speed/20;ctx.fillStyle=o.color;ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#000';ctx.fillRect(o.x+10,o.y+15,o.w-20,20);
if(o.x<bike.x+bike.w && o.x+o.w>bike.x && o.y<bike.y+bike.h && o.y+o.h>bike.y){gameOver();return;}
if(o.y>H){obstacles.splice(i,1);score+=10;speed=Math.min(80,score/5);document.getElementById('score').innerText=score;document.getElementById('speed').innerText=Math.floor(60+speed);}}
// Bike
if(left)bike.x-=12;if(right)bike.x+=12;bike.x=Math.max(W*0.15+10,Math.min(W*0.85-bike.w-10,bike.x));
if(bikeImg.complete&&bikeImg.naturalWidth>0){ctx.drawImage(bikeImg,bike.x,bike.y,bike.w,bike.h);}else{ctx.fillStyle='#ff3b3b';ctx.fillRect(bike.x,bike.y,bike.w,bike.h);ctx.fillStyle='#fbbf24';ctx.fillRect(bike.x+10,bike.y+5,60,8);}
requestAnimationFrame(loop);
}
function gameOver(){gameRunning=false;document.getElementById('startScreen').style.display='flex';document.getElementById('startScreen').innerHTML=`<img src="bike.png" class="bike-logo" style="width:200px"><h1 style="color:#ff3b3b;">GAME OVER!</h1><p style="color:#fff;margin:10px;">Score: ${score}</p><button onclick="startGame()" style="background:#ff3b3b;color:#fff;border:none;padding:14px 35px;border-radius:10px;font-weight:900;margin-top:10px;">🔁 PLAY AGAIN</button><a href="../" style="color:#8aff6b;margin-top:15px;display:block;">Back to Home</a>`;}
</script>
</body>
</html>
