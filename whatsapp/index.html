<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WhatsApp PRO - Made by Faizan</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#111b21;color:#e9edef;overflow:hidden}
.app{max-width:500px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:#111b21}
.header{background:#202c33;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:18px;color:#fff}
.sub{font-size:10px;color:#8696a0}
.topTabs{display:flex;background:#202c33;border-bottom:1px solid #2a3942}
.tab{flex:1;padding:12px;text-align:center;font-size:12px;font-weight:700;color:#8696a0;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{color:#25d366;border-bottom-color:#25d366}
.screen{flex:1;overflow-y:auto;background:#0b141a;position:relative}
#chatScreen{display:none;flex-direction:column;height:100%}
.chatBg{background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:75%;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.4;position:relative;word-break:break-word}
.msg.me{background:#005c4b;align-self:flex-end;border-top-right-radius:0}
.msg.other{background:#202c33;align-self:flex-start;border-top-left-radius:0}
.time{font-size:9px;color:#8696a0;margin-top:3px;text-align:right}
.inputBar{display:flex;gap:8px;padding:8px;background:#202c33;align-items:center}
.inputBar input{flex:1;padding:12px 15px;border-radius:25px;border:none;background:#2a3942;color:#fff;font-size:14px;outline:none}
.btnSend{background:#25d366;border:none;width:45px;height:45px;border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
.contact{padding:12px 15px;display:flex;gap:12px;border-bottom:1px solid #2a3942;cursor:pointer;align-items:center}
.contact:hover{background:#202c33}
.avatar{width:45px;height:45px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:18px}
.qrBox{background:#fff;padding:12px;border-radius:12px;width:200px;height:200px;margin:15px auto;display:flex;align-items:center;justify-content:center}
.idBox{background:#2a3942;color:#25d366;padding:8px 14px;border-radius:20px;font-weight:800;font-size:13px;display:inline-block;margin:10px auto}
.statusBar{padding:8px;text-align:center;font-size:11px;font-weight:700}
.ok{background:#005c4b;color:#fff}
.wait{background:#202c33;color:#8696a0}
#reader{width:100%;display:none}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div><div class="logo">💬 WhatsApp PRO</div><div class="sub">Made by Faizan 🇵🇰 | <span id="myId">...</span></div></div>
<div style="font-size:12px">⚡ P2P</div>
</div>

<div class="topTabs">
<div class="tab active" onclick="showTab('chats')">CHATS</div>
<div class="tab" onclick="showTab('connect')">CONNECT</div>
<div class="tab" onclick="showTab('status')">STATUS</div>
</div>

<div class="screen" id="listScreen">
<div id="statusBar" class="statusBar wait">⏳ ID ban raha hai...</div>
<div style="padding:15px;text-align:center">
<div class="qrBox" id="qrcode"></div>
<div class="idBox">My WhatsApp ID: <span id="myId2">...</span></div>
<p style="font-size:10px;color:#8696a0;margin-top:8px">Dusre phone ko bolo tumhara ID scan kare ya likhe</p>
</div>
<div style="padding:10px">
<div style="display:flex;gap:8px">
<input type="text" id="peerInput" placeholder="Dusre ka ID likho..." style="flex:1;padding:12px;border-radius:8px;border:1px solid #2a3942;background:#202c33;color:#fff">
<button onclick="connectPeer()" style="background:#25d366;color:#fff;border:none;padding:12px 18px;border-radius:8px;font-weight:800">CONNECT</button>
</div>
<button onclick="startScan()" style="width:100%;margin-top:8px;background:#f59e0b;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:800">📷 SCAN QR TO CHAT</button>
<div id="reader"></div>
</div>
<div id="contactsList" style="margin-top:10px"></div>
</div>

<div class="screen" id="chatScreen">
<div class="header" style="background:#202c33">
<div style="display:flex;gap:10px;align-items:center">
<button onclick="backToList()" style="background:none;border:none;color:#fff;font-size:18px">←</button>
<div class="avatar" id="chatAvatar">F</div>
<div><div style="font-weight:800;font-size:14px" id="chatName">Friend</div><div style="font-size:10px;color:#25d366" id="chatStatus">Online - P2P Connected</div></div>
</div>
</div>
<div class="chatBg" id="messages"></div>
<div class="inputBar">
<input type="text" id="msgInput" placeholder="Message" onkeypress="if(event.key==='Enter')sendMsg()">
<button class="btnSend" onclick="sendMsg()">➤</button>
</div>
</div>

</div>

<script>
let peer, conn, myIdNum, currentChat=null;
let myId = Math.floor(100000 + Math.random()*900000);
myIdNum=myId;
document.getElementById('myId').innerText=myId;
document.getElementById('myId2').innerText=myId;

function makeQR(text){
 document.getElementById('qrcode').innerHTML='';
 new QRCode(document.getElementById('qrcode'), {text:text, width:180, height:180});
}

peer = new Peer('faizan-wa-'+myId);

peer.on('open', ()=>{
 makeQR(myId.toString());
 document.getElementById('statusBar').innerHTML='✅ Ready! ID: '+myId+' - QR share karo';
 document.getElementById('statusBar').className='statusBar ok';
});

peer.on('connection', c=>{
 conn=c;
 setupConn(c.peer);
 addContact(c.peer);
});

function connectPeer(){
 let otherId=document.getElementById('peerInput').value.trim().replace(/[^0-9]/g,'');
 if(!otherId || otherId==myId){alert('Sahi ID likho!');return;}
 conn=peer.connect('faizan-wa-'+otherId, {reliable:true});
 setupConn('faizan-wa-'+otherId);
}

function setupConn(peerId){
 conn.on('open', ()=>{
  document.getElementById('statusBar').innerHTML='✅ Connected to '+peerId.replace('faizan-wa-','');
  document.getElementById('statusBar').className='statusBar ok';
  addContact(peerId);
  openChat(peerId);
  stopScan();
 });
 conn.on('data', data=>{
  if(data.type==='msg'){
   showMsg(data.text, false);
   if(Notification.permission==='granted') new Notification('WhatsApp PRO: '+data.text);
  }
 });
 conn.on('close', ()=>{document.getElementById('chatStatus').innerText='Offline';});
}

let contacts={};
function addContact(peerId){
 let idNum=peerId.replace('faizan-wa-','');
 if(contacts[idNum]) return;
 contacts[idNum]=peerId;
 let div=document.createElement('div');
 div.className='contact';
 div.innerHTML=`<div class="avatar">${idNum[0]}</div><div style="flex:1"><div style="font-weight:700;font-size:14px">Friend ${idNum}</div><div style="font-size:11px;color:#8696a0">Tap to chat - P2P Secure</div></div><div style="font-size:10px;color:#25d366">● Online</div>`;
 div.onclick=()=>openChat(peerId);
 document.getElementById('contactsList').appendChild(div);
}

function openChat(peerId){
 currentChat=peerId;
 document.getElementById('listScreen').style.display='none';
 document.getElementById('chatScreen').style.display='flex';
 document.getElementById('chatName').innerText='Friend '+peerId.replace('faizan-wa-','');
 document.getElementById('chatAvatar').innerText=peerId.replace('faizan-wa-','')[0];
 document.getElementById('messages').innerHTML='';
}

function backToList(){
 document.getElementById('chatScreen').style.display='none';
 document.getElementById('listScreen').style.display='block';
}

function sendMsg(){
 let txt=document.getElementById('msgInput').value.trim();
 if(!txt) return;
 if(!conn || !conn.open){alert('Pehle CONNECT karo!');return;}
 showMsg(txt, true);
 conn.send({type:'msg', text:txt});
 document.getElementById('msgInput').value='';
}

function showMsg(text, me){
 let div=document.createElement('div');
 div.className='msg '+(me?'me':'other');
 let time=new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
 div.innerHTML=`${text}<div class="time">${time} ${me?'✓✓':''}</div>`;
 document.getElementById('messages').appendChild(div);
 document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
}

function showTab(t){
 if(t==='chats'){document.getElementById('listScreen').style.display='block'; document.getElementById('chatScreen').style.display='none';}
 if(t==='connect'){document.getElementById('listScreen').style.display='block'; document.getElementById('chatScreen').style.display='none'; window.scrollTo(0,0);}
 if(t==='status'){alert('Status Feature - Jaldi ayega! Abhi chat karo.');}
}

// QR Scanner
let html5Qr;
function startScan(){
 document.getElementById('reader').style.display='block';
 if(!html5Qr) html5Qr=new Html5Qrcode("reader");
 html5Qr.start({facingMode:"environment"}, {fps:10, qrbox:250}, (decoded)=>{
  document.getElementById('peerInput').value=decoded;
  connectPeer();
 }, ()=>{}).catch(()=>alert('Camera allow karo!'));
}
function stopScan(){
 if(html5Qr){html5Qr.stop().then(()=>{document.getElementById('reader').style.display='none';}).catch(()=>{});}
}

if(Notification && Notification.permission!=='granted') Notification.requestPermission();
</script>
</body>
  </html>
