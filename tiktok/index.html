<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikTok PRO - Faizan</title>
<link rel="manifest" href="../manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden;height:100vh}
#feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.videoBox{height:100vh;position:relative;scroll-snap-align:start;background:#000;display:flex;align-items:center;justify-content:center}
.videoBox video{height:100%;width:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;right:0;padding:15px;background:linear-gradient(transparent,rgba(0,0,0,0.9));display:flex;justify-content:space-between;align-items:flex-end}
.left{width:75%}
.user{font-weight:900;font-size:15px}
.desc{font-size:13px;margin:5px 0;opacity:0.9}
.music{font-size:11px;opacity:0.7}
.right{display:flex;flex-direction:column;gap:18px;align-items:center}
.iconBtn{width:48px;height:48px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:none;color:#fff;cursor:pointer}
.iconBtn.liked{background:#fe2c55}
.count{font-size:11px;font-weight:700;margin-top:-12px}
.topBar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;padding:12px 15px;background:linear-gradient(rgba(0,0,0,0.8),transparent)}
.topBar b{font-size:18px}
.topBtn{background:#fff;color:#000;padding:6px 14px;border-radius:4px;font-weight:900;font-size:12px;border:none;cursor:pointer}
#loginModal,#uploadModal,#profileModal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.box{background:#121212;border-radius:16px;padding:20px;width:100%;max-width:340px;border:1px solid #222}
.box h2{font-size:18px;margin-bottom:15px;text-align:center}
.box input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#1e1e1e;color:#fff;margin-bottom:10px;outline:none}
.box button{width:100%;padding:12px;background:#fe2c55;color:#fff;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:5px}
.small{font-size:11px;text-align:center;margin-top:10px;color:#aaa}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:20}
.bottomNav div{text-align:center;font-size:10px;color:#888;cursor:pointer}
.bottomNav div.active{color:#fff}
.bottomNav div span{display:block;font-size:20px}
#comments{position:absolute;bottom:70px;left:10px;right:70px;max-height:120px;overflow:auto}
.cmt{font-size:11px;background:rgba(255,255,255,0.1);padding:5px 8px;border-radius:10px;margin-top:4px}
</style>
</head>
<body>

<div class="topBar">
<b>TikTok PRO 🇵🇰</b>
<div>
<button class="topBtn" onclick="openUpload()">+ Upload</button>
<button class="topBtn" id="loginBtn" onclick="openLogin()" style="margin-left:6px">Login</button>
</div>
</div>

<div id="feed"></div>

<div class="bottomNav">
<div class="active"><span>🏠</span>Home</div>
<div onclick="document.getElementById('feed').scrollTop=0"><span>🔍</span>Discover</div>
<div onclick="openUpload()"><span style="background:#fff;color:#000;padding:2px 10px;border-radius:6px">+</span></div>
<div onclick="openProfile()"><span>👤</span>Profile</div>
</div>

<!-- LOGIN -->
<div id="loginModal">
<div class="box">
<h2>Login / Signup</h2>
<input id="uName" placeholder="Username likho (jaise faizan123)">
<input id="uPass" type="password" placeholder="Password">
<button onclick="doLogin()">Login / Account Banao</button>
<button onclick="closeLogin()" style="background:#333">Close</button>
<div class="small">Bina login ke bhi video dekh sakte ho, login se upload hoga</div>
</div>
</div>

<!-- UPLOAD -->
<div id="uploadModal">
<div class="box">
<h2>Video Upload Karo</h2>
<input id="vDesc" placeholder="Caption likho... #fyp">
<input type="file" id="vFile" accept="video/*" style="color:#fff">
<button onclick="doUpload()">Upload TikTok</button>
<button onclick="closeUpload()" style="background:#333">Cancel</button>
<div class="small" id="upStatus"></div>
</div>
</div>

<script>
let currentUser = localStorage.getItem('tikUser') || null;
let videos = JSON.parse(localStorage.getItem('tikVideos') || 'null') || [
{user:'@faizan_viral',desc:'G-Wagon Drift in Gujranwala 🔥 #fyp #pakistan',music:'Original Sound - Faizan',url:'https://www.w3schools.com/html/mov_bbb.mp4',likes:1240,comments:['Nice bro!','🔥🔥']},
{user:'@kotmomin_official',desc:'Kot Momin ka Kinnow Bagh 🍊 #kotmomin',music:'Punjabi Song',url:'https://www.w3schools.com/html/movie.mp4',likes:892,comments:['MashaAllah']},
{user:'@midh_ranjha',desc:'Heer Ranjha ka gaon ❤️ #midhranjha',music:'Heer - Atif Aslam',url:'https://www.w3schools.com/html/mov_bbb.mp4',likes:2100,comments:[]}
];

function render(){
 let feed=document.getElementById('feed');
 feed.innerHTML='';
 videos.forEach((v,i)=>{
  feed.innerHTML+=`
  <div class="videoBox">
   <video src="${v.url}" loop autoplay muted playsinline onclick="this.paused?this.play():this.pause()"></video>
   <div class="overlay">
    <div class="left">
     <div class="user">${v.user}</div>
     <div class="desc">${v.desc}</div>
     <div class="music">🎵 ${v.music}</div>
     <div id="comments-${i}">${v.comments.map(c=>`<div class=cmt>${c}</div>`).join('')}</div>
     <div style="display:flex;gap:5px;margin-top:8px">
      <input id="cInp-${i}" placeholder="Comment..." style="flex:1;padding:6px;border-radius:10px;border:none;background:rgba(255,255,255,0.15);color:#fff;font-size:11px">
      <button onclick="addComment(${i})" style="padding:6px 10px;border-radius:10px;border:none;background:#fe2c55;color:#fff;font-size:11px">Send</button>
     </div>
    </div>
    <div class="right">
     <button class="iconBtn" onclick="likeVideo(${i},this)">❤️</button><div class="count" id="like-${i}">${v.likes}</div>
     <button class="iconBtn" onclick="document.getElementById('cInp-${i}').focus()">💬</button><div class="count">${v.comments.length}</div>
     <button class="iconBtn" onclick="shareVideo(${i})">↗️</button>
     <button class="iconBtn" onclick="followUser('${v.user}')">+</button>
    </div>
   </div>
  </div>`;
 });
 if(currentUser) document.getElementById('loginBtn').innerText=currentUser;
}

function openLogin(){document.getElementById('loginModal').style.display='flex'}
function closeLogin(){document.getElementById('loginModal').style.display='none'}
function doLogin(){
 let u=document.getElementById('uName').value.trim();
 if(!u) return alert('Username likho');
 localStorage.setItem('tikUser',u);
 currentUser=u;
 closeLogin();
 render();
 alert('Welcome '+u+'! Ab upload kar sakte ho');
}

function openUpload(){
 if(!currentUser) return openLogin();
 document.getElementById('uploadModal').style.display='flex'
}
function closeUpload(){document.getElementById('uploadModal').style.display='none'}

function doUpload(){
 let file=document.getElementById('vFile').files[0];
 let desc=document.getElementById('vDesc').value || '#fyp';
 if(!file) return alert('Video select karo');
 document.getElementById('upStatus').innerText='Uploading...';
 let reader=new FileReader();
 reader.onload=function(e){
  let url=e.target.result;
  videos.unshift({user:'@'+currentUser,desc:desc,music:'Original - '+currentUser,url:url,likes:0,comments:[]});
  localStorage.setItem('tikVideos',JSON.stringify(videos));
  closeUpload();
  render();
  alert('Video Upload Hogayi! 🔥');
 };
 reader.readAsDataURL(file);
}

function likeVideo(i,btn){
 videos[i].likes++;
 document.getElementById('like-'+i).innerText=videos[i].likes;
 btn.classList.add('liked');
 localStorage.setItem('tikVideos',JSON.stringify(videos));
}
function addComment(i){
 let inp=document.getElementById('cInp-'+i);
 if(!inp.value.trim()) return;
 videos[i].comments.push(currentUser ? currentUser+': '+inp.value : inp.value);
 localStorage.setItem('tikVideos',JSON.stringify(videos));
 render();
}
function shareVideo(i){
 if(navigator.share) navigator.share({title:'TikTok PRO',text:videos[i].desc,url:location.href});
 else {navigator.clipboard.writeText(location.href); alert('Link Copy Hogaya!');}
}
function followUser(u){alert(u+' ko Follow kar liya! ✅')}
function openProfile(){
 if(!currentUser) return openLogin();
 alert('Profile: '+currentUser+'\nVideos: '+videos.filter(v=>v.user.includes(currentUser)).length+'\nLikes: '+videos.reduce((s,v)=>s+v.likes,0));
}
render();
</script>
</body>
</html>
